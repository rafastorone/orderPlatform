spring:
  application:
    name: order-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5435/orders
    username: order_user
    password: order_local_password
  kafka:
    bootstrap-servers: localhost:29092
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
