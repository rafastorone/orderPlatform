name: payment-service

services:
  payment-service:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8084:8080"
    depends_on:
      payment-service-postgres:
        condition: service_healthy
    networks:
      - orderflow-network

  payment-service-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5436:5432"
    volumes:
      - payment-service-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - orderflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payments"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  payment-service-postgres-data:
    name: payment-service-postgres-data

networks:
  orderflow-network:
    external: true
    name: orderflow-network
