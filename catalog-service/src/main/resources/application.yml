server:
  port: 8081

spring:
  application:
    name: catalog-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5433/catalog
    username: catalog_user
    password: catalog_local_password
  kafka:
    bootstrap-servers: localhost:29092
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
